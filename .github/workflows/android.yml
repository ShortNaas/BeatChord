name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - uses: android-actions/setup-android@v3

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > beatchord-release.jks
        {
          echo "storeFile=beatchord-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # A release APK has to be signed. The key is optional so this job still
    # produces something installable on a fork without the signing secrets; the
    # fallback is the dev-signed debug APK.
    - name: Build the APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          ./gradlew assembleProdRelease
        else
          echo "No release keystore configured — building a dev-signed APK." >&2
          ./gradlew assembleDevDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: beatchord-release-apk
        if-no-files-found: warn
        path: |
          app/build/outputs/apk/prod/release/*.apk
          app/build/outputs/apk/dev/debug/*.apk
